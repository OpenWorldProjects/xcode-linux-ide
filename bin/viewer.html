<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>tuxmirror - iPhone 16 Pro Live View</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      margin-bottom: 20px;
      text-align: center;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: #58a6ff;
    }
    .header p {
      font-size: 13px;
      color: #8b949e;
      margin-top: 4px;
    }
    .phone-container {
      position: relative;
      width: 375px;
      height: 812px;
      background: #000;
      border-radius: 54px;
      box-shadow: 0 0 0 12px #1f242c, 0 0 0 14px #30363d, 0 30px 60px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      border: 3px solid #000;
    }
    /* Dynamic Island */
    .island {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 34px;
      background: #000;
      border-radius: 20px;
      z-index: 10;
      pointer-events: none;
    }
    .screen-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(35, 134, 54, 0.2);
      border: 1px solid #238636;
      border-radius: 20px;
      color: #3fb950;
      font-size: 12px;
      margin-top: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #3fb950;
      border-radius: 50%;
      box-shadow: 0 0 8px #3fb950;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🐧 tuxmirror</h1>
    <p>Dino's iPhone 16 Pro &bull; USB Live Mirror</p>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>Connected & Streaming</span>
    </div>
  </div>

  <div class="phone-container">
    <div class="island"></div>
    <img id="stream" class="screen-img" src="http://127.0.0.1:3333/" alt="iPhone Screen" onerror="handleError()">
  </div>

  <script>
    function handleError() {
      console.warn("Stream disconnected, retrying in 2s...");
      setTimeout(() => {
        document.getElementById('stream').src = 'http://127.0.0.1:3333/?t=' + Date.now();
      }, 2000);
    }
  </script>
</body>
</html>
